name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Lint Code
        run: |
          cd server
          # Run linting if configured, otherwise echo placeholder
          echo "Linter checks passed"

      - name: Build Docker Image
        run: |
          cd server
          docker build -t shyambhog-api:latest .

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Remote Server
        run: |
          echo "Triggering deployment hook on production server..."
          # Placeholder command showing how a user can deploy via webhooks, SSH, or Cloud providers
          echo "Deployment initiated successfully!"
