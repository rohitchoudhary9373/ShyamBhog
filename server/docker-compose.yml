version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: shyambhog-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - shyambhog-network

  redis:
    image: redis:7.0-alpine
    container_name: shyambhog-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shyambhog-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shyambhog-api
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/shyambhog
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-shyambhog_jwt_secret_2026}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./logs:/usr/src/app/logs
    networks:
      - shyambhog-network

networks:
  shyambhog-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
